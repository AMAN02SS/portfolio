name: Next.js Application CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Test and Build
    runs-on: ubuntu-latest
    # यहाँ हम बिल्ड की हुई फाइल्स को अगले जॉब (deploy) के लिए सेव करेंगे
    outputs:
      build-success: ${{ steps.build.outcome }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build application
        id: build
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: npm run build

      - name: Prepare standalone production package
        run: |
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static

          if [ -d public ]; then
            cp -r public .next/standalone/public
          fi  

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-prod-build
          path: .next/standalone/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Azure VM
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # GitHub Actions द्वारा बिल्ड किये गए एसेट्स को डाउनलोड करें
      - name: Download production assets
        uses: actions/download-artifact@v4
        with:
          name: next-prod-build
          path: deploy-package

      - name: Validate deployment configuration
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          if [[ ! "$VM_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "Invalid VM_HOST format"
            exit 1
          fi

          if [[ ! "$VM_USER" =~ ^[a-z_][a-z0-9_-]*[$]?$ ]]; then
            echo "Invalid VM_USER format"
            exit 1
          fi    

      - name: Configure SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy standalone artifact to Azure VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -e
          rsync -az --delete \
            -e "ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            deploy-package/ \
            "$VM_USER@$VM_HOST:~/apps/nextjs-app/"

      - name: Transfer MongoDB URI securely
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          set -euo pipefail

          printf '%s' "$MONGODB_URI" | base64 -w0 | \
            ssh -i "$HOME/.ssh/deploy_key" \
              -o StrictHostKeyChecking=yes \
              "$VM_USER@$VM_HOST" \
              'umask 077
               mkdir -p "$HOME/.config/nextjs-app"
               cat > "$HOME/.config/nextjs-app/mongodb_uri.b64"
               chmod 600 "$HOME/.config/nextjs-app/mongodb_uri.b64"'      

      - name: Start or reload Next.js
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -e

          ssh -i "$HOME/.ssh/deploy_key" \
            -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" \
            'set -e
             APP_DIR="$HOME/apps/nextjs-app"
             SECRET_FILE="$HOME/.config/nextjs-app/mongodb_uri.b64"

             cd "$APP_DIR"
             export PORT=3000
             export HOSTNAME=127.0.0.1
             export MONGODB_URI="$(base64 -d "$SECRET_FILE")"

             if pm2 describe nextjs-app >/dev/null 2>&1; then
               pm2 reload nextjs-app --update-env
             else
               pm2 start server.js --name nextjs-app --cwd "$APP_DIR"
             fi

             unset MONGODB_URI
             pm2 save'
