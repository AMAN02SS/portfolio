name: Next.js Application CI-CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build application
        # 🛠️ यहाँ बदलाव किया गया है: बिल्ड स्टेप को सीक्रेट पास किया गया
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: npm run build

  deploy:
    name: Deploy to Azure VM
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy application to Azure VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='.env*' \
            --exclude='*.pem' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./ "$VM_USER@$VM_HOST:~/apps/nextjs-app/"

      - name: Build and restart application on VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          # 🛠️ यहाँ बदलाव किया गया है: सर्वर पर बिल्ड करते समय एरर न आये इसलिए SSH कमांड के अंदर वेरिएबल पास किया
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" \
            "set -e
             cd ~/apps/nextjs-app
             npm ci
             # यहाँ हमने पर्यावरण वेरिएबल को रिमोट सर्वर कमांड में इंजेक्ट कर दिया है
             MONGODB_URI='${MONGODB_URI}' npm run build
             if pm2 describe nextjs-app >/dev/null 2>&1; then
               pm2 reload nextjs-app
             else
               pm2 start npm --name nextjs-app -- start -- -p 3000
             fi
             pm2 save"
