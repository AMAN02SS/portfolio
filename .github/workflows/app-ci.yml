name: Next.js Application CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Test and Build
    runs-on: ubuntu-latest
    # यहाँ हम बिल्ड की हुई फाइल्स को अगले जॉब (deploy) के लिए सेव करेंगे
    outputs:
      build-success: ${{ steps.build.outcome }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build application
        id: build
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: npm run build

      - name: Upload production assets
        uses: actions/upload-artifact@v4
        with:
          name: next-prod-build
          path: |
            .next/
            public/
            package.json
            package-lock.json
            next.config.js
            # यदि आपकी कोई और ज़रूरी फ़ाइल/फोल्डर (जैसे prismic, components) हो तो यहाँ ऐड कर सकते हैं

  deploy:
    name: Deploy to Azure VM
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # GitHub Actions द्वारा बिल्ड किये गए एसेट्स को डाउनलोड करें
      - name: Download production assets
        uses: actions/download-artifact@v4
        with:
          name: next-prod-build

      - name: Configure SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy application to Azure VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          # अब हम .next फोल्डर को भी एक्सक्लूड नहीं कर रहे हैं, क्योंकि वह पहले से रेडी है
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='.env*' \
            --exclude='*.pem' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./ "$VM_USER@$VM_HOST:~/apps/nextjs-app/"

      - name: Start application on VM (No Build Needed Here)
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" \
            "set -e
             cd ~/apps/nextjs-app
             # सर्वर पर केवल ज़रूरी प्रोडक्शन पैकेजेस इंस्टॉल होंगे, कोई भारी बिल्ड नहीं चलेगा
             npm install --omit=dev
             
             if pm2 describe nextjs-app >/dev/null 2>&1; then
               # बिना डाउनटाइम के एप्लिकेशन्स को तुरंत रीलोड करें
               MONGODB_URI='${MONGODB_URI}' pm2 reload nextjs-app
             else
               MONGODB_URI='${MONGODB_URI}' pm2 start npm --name nextjs-app -- start -- -p 3000
             fi
             pm2 save"
