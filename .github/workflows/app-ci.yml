name: Next.js Application CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Install, Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        # We pass a placeholder string to prevent Mongoose/MongoDB connection errors during build
        env:
          MONGODB_URI: "mongodb://localhost:27017/build-placeholder"
          NEXTAUTH_SECRET: "placeholder-secret-for-build-purposes-only"
        run: npm run build
